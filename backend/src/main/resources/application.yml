server:
  port: 8080
  tomcat:
    # 放宽请求体上限，兜底图片(base64)上传（前端已先压缩，通常仅百KB级）
    max-swallow-size: 20MB
    max-http-form-post-size: 20MB

spring:
  application:
    name: warehouse-ms
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ahut_base?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: wms
    password: wms123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  web:
    resources:
      static-locations: classpath:/static/

logging:
  level:
    root: INFO
    com.wms: INFO
