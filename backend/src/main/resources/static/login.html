<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 小明智库</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#eef2f9;color:#0f1b33}
  .wrap{display:flex;min-height:100vh}
  /* 左侧登录面板 */
  .left{width:46%;max-width:620px;min-width:380px;background:#fff;display:flex;flex-direction:column;justify-content:center;
    padding:48px 8%;position:relative}
  .brand{display:flex;align-items:center;gap:10px;position:absolute;top:34px;left:8%}
  .brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,#3d8bef,#1b57b0);
    display:grid;place-items:center;box-shadow:0 6px 16px rgba(28,92,171,.35)}
  .brand .logo svg{width:18px;height:18px}
  .brand b{font-size:15px;letter-spacing:.3px;color:#0f1b33}
  .panel{width:100%;max-width:380px;margin:0 auto}
  h1{font-size:26px;margin:0 0 8px;letter-spacing:.3px}
  .sub{color:#8a99b5;font-size:13px;margin-bottom:30px;line-height:1.6}
  /* 选项卡 */
  .tabs{display:flex;gap:26px;border-bottom:1px solid #eef1f7;margin-bottom:26px}
  .tabs .tab{padding-bottom:12px;font-size:15px;color:#8a99b5;cursor:pointer;position:relative;font-weight:500}
  .tabs .tab.on{color:#2a78d6;font-weight:600}
  .tabs .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:#2a78d6}
  /* 输入框 */
  .field{margin-bottom:18px}
  .inp{display:flex;align-items:center;gap:10px;background:#f7f9fd;border:1px solid #e3e9f3;border-radius:11px;
    padding:13px 15px;transition:border-color .15s,box-shadow .15s}
  .inp:focus-within{border-color:#2a78d6;background:#fff;box-shadow:0 0 0 3px rgba(42,120,214,.12)}
  .inp svg.lead{width:18px;height:18px;color:#8a99b5;flex:0 0 auto}
  .inp input{flex:1;background:none;border:none;outline:none;color:#0f1b33;font-size:14.5px}
  .inp input::placeholder{color:#a9b4c9}
  .eye{width:20px;height:20px;color:#a9b4c9;cursor:pointer;flex:0 0 auto}
  .eye:hover{color:#2a78d6}
  .row-between{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 22px;font-size:13px}
  .row-between a{color:#8a99b5;text-decoration:none}
  .row-between a:hover{color:#2a78d6}
  .loginBtn{width:100%;padding:14px;border:none;border-radius:11px;background:linear-gradient(180deg,#3d8bef,#2a6fd0);
    color:#fff;font-size:15.5px;font-weight:600;cursor:pointer;box-shadow:0 10px 24px rgba(42,111,208,.32);
    transition:transform .12s,box-shadow .12s}
  .loginBtn:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(42,111,208,.42)}
  .loginBtn:disabled{opacity:.6;cursor:default;transform:none}
  .err{color:#d03b3b;font-size:13px;margin-top:14px;min-height:18px;text-align:center}
  .hint{margin-top:22px;text-align:center;font-size:12.5px;color:#a9b4c9;line-height:1.9}
  .hint code{background:#f1f4fa;padding:2px 7px;border-radius:6px;color:#5a6b85}
  /* 右侧图片 */
  .right{flex:1;position:relative;background:#0a1120;overflow:hidden}
  .right img{width:100%;height:100%;object-fit:cover;display:block}
  .right .veil{position:absolute;inset:0;background:linear-gradient(120deg,rgba(42,120,214,.34),rgba(10,17,32,.14) 60%)}
  .right .cap{position:absolute;left:44px;bottom:44px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.4);max-width:60%}
  .right .cap h2{font-size:24px;margin:0 0 8px;font-weight:700}
  .right .cap p{font-size:14px;margin:0;color:#dbe6fb;line-height:1.7}
  @media (max-width:820px){ .right{display:none} .left{width:100%;max-width:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2 3 6.5v11L12 22l9-4.5v-11L12 2Z" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/><path d="M3 6.5 12 11l9-4.5M12 11v11" stroke="#fff" stroke-width="1.7" stroke-linejoin="round" opacity=".7"/></svg></div>
      <b>小明智库</b>
    </div>
    <form class="panel" id="form">
      <h1>欢迎登录 · 小明智库</h1>
      <div class="sub">面向超市 / 日用仓库的进销存智库，实时掌握每件商品的库存、进货与卖出。</div>

      <div class="tabs">
        <div class="tab on">账号密码登录</div>
      </div>

      <div class="field">
        <div class="inp">
          <svg class="lead" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M4 21a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="number" placeholder="请输入用户名" autocomplete="username" value="admin">
        </div>
      </div>

      <div class="field">
        <div class="inp">
          <svg class="lead" viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8"/></svg>
          <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
          <svg class="eye" id="eye" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/></svg>
        </div>
      </div>

      <div class="row-between">
        <a href="javascript:void(0)">没有账号？立即注册</a>
        <a href="javascript:void(0)">忘记密码</a>
      </div>

      <button type="submit" class="loginBtn" id="btn">登 录</button>
      <div class="err" id="err"></div>
      <div class="hint">演示账号：<code>admin / admin123</code> · <code>test / 123456</code></div>
    </form>
  </div>
  <div class="right">
    <img src="img/login-side.png" alt="智能仓库">
    <div class="veil"></div>
    <div class="cap"><h2>智慧仓储 · 一目了然</h2><p>库存预警、出入库流水、进销存分析，让选品与进货更精准。</p></div>
  </div>
</div>
<script>
  const $=s=>document.querySelector(s);
  if(localStorage.getItem('wms_token')) location.href='index.html';
  // 密码显隐
  $('#eye').addEventListener('click',()=>{
    const p=$('#password'); p.type = p.type==='password' ? 'text' : 'password';
    $('#eye').style.color = p.type==='text' ? '#2a78d6' : '';
  });
  $('#form').addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=$('#btn'), err=$('#err'); err.textContent=''; btn.disabled=true; btn.textContent='登录中…';
    try{
      const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({number:$('#number').value.trim(),password:$('#password').value})});
      const j=await r.json();
      if(j.code===200){
        localStorage.setItem('wms_token',j.data.token);
        localStorage.setItem('wms_user',JSON.stringify(j.data.user));
        location.href='index.html';
      }else{ err.textContent=j.msg||'登录失败'; }
    }catch(ex){ err.textContent='网络错误，请重试'; }
    btn.disabled=false; btn.textContent='登 录';
  });
</script>
</body>
</html>
