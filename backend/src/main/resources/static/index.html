<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日用仓库管理系统智库</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2 3 6.5v11L12 22l9-4.5v-11L12 2Z" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/><path d="M3 6.5 12 11l9-4.5M12 11v11" stroke="#fff" stroke-width="1.7" stroke-linejoin="round" opacity=".7"/></svg></div>
      <div><b>日用仓库智库</b><span>进销存 · 库存预警</span></div>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="side-foot">
      <div class="av" id="avatar">超</div>
      <div><div class="nm" id="uname">—</div><small id="unum">—</small></div>
      <button class="lo" id="logout" title="退出登录"><svg viewBox="0 0 24 24" width="17" height="17" fill="none"><path d="M15 12H4m0 0 4-4m-4 4 4 4M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div><h1 id="pageTitle">运营总览</h1><div class="sub" id="pageSub"></div></div>
      <div class="spacer"></div>
      <div class="chip"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M3 9h18M8 3v4m8-4v4" stroke="currentColor" stroke-width="1.7"/></svg><span id="today"></span></div>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
